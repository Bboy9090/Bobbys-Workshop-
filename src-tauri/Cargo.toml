[package]
name = "bobfwtools"
version = "0.1.0"
description = "BobFWTools - professional macOS Android connectivity, diagnostics, MTP and device support toolkit"
authors = ["Bobby Blanco"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4"] }
bootforgeusb = { path = "../libs/bootforgeusb", default-features = false }
dirs = "6.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
mtp-rs = "0.32"
bytes = "1"
futures = "0.3"
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
legacy-backends = []
qualified-flash = []
