name: BobFWTools Read-Only Verification Safety

on:
  push:
    branches:
      - feat/safe-android-single-batch-deploy-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification-core:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Rust authorization and collector tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin bobfwtools
      - name: Frontend integration and lifecycle tests
        run: npm run test:integration
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Verify source is clean
        run: git diff --exit-code
