name: BobFWTools macOS Core

on:
  pull_request:
    branches: [ "main-tool-kit" ]
  push:
    branches: [ "feat/bobfwtools-macos-foundation" ]

permissions:
  contents: read

jobs:
  macos-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install frontend dependencies
        run: npm install

      - name: Production reality gate
        run: npm run verify:reality

      - name: Build frontend
        run: npm run build

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check BootForge USB
        run: cargo check --manifest-path libs/bootforgeusb/Cargo.toml

      - name: Check BobFWTools Tauri core
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run BootForge USB tests
        run: cargo test --manifest-path libs/bootforgeusb/Cargo.toml
