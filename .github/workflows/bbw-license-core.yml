name: BBW License Core

on:
  pull_request:
    branches: [ "feat/bobfwtools-macos-foundation" ]
    paths:
      - 'libs/bbw-license-core/**'
      - '.github/workflows/bbw-license-core.yml'
  push:
    branches: [ "feat/bobfwtools-macos-foundation" ]
    paths:
      - 'libs/bbw-license-core/**'
      - '.github/workflows/bbw-license-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Format
        run: cargo fmt --manifest-path libs/bbw-license-core/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path libs/bbw-license-core/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path libs/bbw-license-core/Cargo.toml --all-targets
