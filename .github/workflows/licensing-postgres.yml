name: Licensing PostgreSQL Qualification

on:
  pull_request:
    branches: [ "feat/bobfwtools-macos-foundation" ]
    paths:
      - 'db/licensing/**'
      - 'server/licensing/**'
      - 'tests/licensing/**'
      - '.github/workflows/licensing-postgres.yml'
  push:
    branches: [ "feat/bobfwtools-macos-foundation" ]
    paths:
      - 'db/licensing/**'
      - 'server/licensing/**'
      - 'tests/licensing/**'
      - '.github/workflows/licensing-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bbw_license_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bbw_license_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bbw_license_test
    steps:
      - uses: actions/checkout@v7
      - name: Apply licensing migration
        run: psql -v ON_ERROR_STOP=1 -f db/licensing/0001_licensing_hardening.sql
      - name: Run licensing SQL contract tests
        run: psql -v ON_ERROR_STOP=1 -f db/licensing/test/0001_test.sql | tee licensing-postgres-test.log
      - name: Require migration test receipt
        run: grep -q MIGRATION_TESTS_PASS licensing-postgres-test.log

  node-transactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Run licensing transaction tests
        run: npx vitest run tests/licensing/charge.test.js
