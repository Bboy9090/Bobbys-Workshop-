name: Node.js CI

on:
  push:
    branches: [ "main", "master", "main-tool-kit", "feat/bobfwtools-macos-foundation", "feat/bobfwtools-calibration-edl-safety", "integration/hardware-readiness-foundation-20261018" ]
  pull_request:
    branches: [ "main", "master", "main-tool-kit", "feat/bobfwtools-macos-foundation", "feat/bobfwtools-calibration-edl-safety", "integration/hardware-readiness-foundation-20261018" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOBFWTOOLS_SOURCE_REVISION: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24.x"
        package-manager-cache: false
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Install packaged API dependencies
      run: npm ci --prefix src-tauri/resources/server --ignore-scripts

    - name: Production Reality Gate
      run: npm run verify:reality

    - name: Lint workspace
      run: npm run lint

    - name: Typecheck Frontend
      run: npm run typecheck

    - name: Build
      run: npm run build --if-present
      
    - name: Test
      run: npm test --if-present

    - name: Validate workflow definitions
      run: npm run test:workflows


  macos-rust:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24.x"
        package-manager-cache: false

    - name: Install Dependencies
      run: npm ci

    - name: Production Reality Gate
      run: npm run verify:reality

    - name: Typecheck Frontend
      run: npm run typecheck

    - name: Build Frontend
      run: npm run build

    - name: Check embedded USB crate
      run: cargo check --manifest-path libs/bootforgeusb/Cargo.toml --no-default-features

    - name: Check Tauri Rust core
      run: cargo check --manifest-path src-tauri/Cargo.toml --locked

    - name: Check qualified destructive writer build
      run: cargo check --manifest-path src-tauri/Cargo.toml --locked --features qualified-flash

    - name: Test standard app Rust gates
      run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features

    - name: Test qualified destructive writer gates
      run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features qualified-flash


  workspace-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: "24.x"
        package-manager-cache: false
    - name: Install locked frontend dependencies
      run: npm ci
    - name: Typecheck and build the workspace
      run: npm run typecheck && npm run build
    - name: Install isolated browser test runtime
      run: |
        npm install --prefix "$RUNNER_TEMP/bobfw-ui" --no-audit --no-fund --package-lock=false --ignore-scripts playwright@1.64.0
        "$RUNNER_TEMP/bobfw-ui/node_modules/.bin/playwright" install --with-deps chromium
    - name: Check navigation, density, state retention, and narrow screens
      env:
        BOBFW_PLAYWRIGHT_MODULE: ${{ runner.temp }}/bobfw-ui/node_modules/playwright
      run: node scripts/qualify-workspace-ui.cjs
    - name: Upload browser-only UI evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: BobFWTools-workspace-ui-evidence
        path: artifacts/workspace-ui/
        if-no-files-found: warn
        compression-level: 0
