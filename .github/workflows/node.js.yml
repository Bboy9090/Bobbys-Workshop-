name: Node.js CI

on:
  push:
    branches: [ "main", "master", "main-tool-kit", "feat/bobfwtools-macos-foundation", "feat/bobfwtools-calibration-edl-safety", "integration/hardware-readiness-foundation-20261018" ]
  pull_request:
    branches: [ "main", "master", "main-tool-kit", "feat/bobfwtools-macos-foundation", "feat/bobfwtools-calibration-edl-safety", "integration/hardware-readiness-foundation-20261018" ]

permissions:
  contents: read

env:
  BOBFWTOOLS_SOURCE_REVISION: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24.x"
        package-manager-cache: false
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Install packaged API dependencies
      run: npm ci --prefix src-tauri/resources/server --ignore-scripts

    - name: Production Reality Gate
      run: npm run verify:reality

    - name: Typecheck Frontend
      run: npm run typecheck

    - name: Build
      run: npm run build --if-present
      
    - name: Test
      run: npm test --if-present

    - name: Validate workflow definitions
      run: npm run test:workflows


  macos-rust:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24.x"
        package-manager-cache: false

    - name: Install Dependencies
      run: npm install

    - name: Production Reality Gate
      run: npm run verify:reality

    - name: Typecheck Frontend
      run: npm run typecheck

    - name: Build Frontend
      run: npm run build

    - name: Check embedded USB crate
      run: cargo check --manifest-path libs/bootforgeusb/Cargo.toml --no-default-features

    - name: Check Tauri Rust core
      run: cargo check --manifest-path src-tauri/Cargo.toml

    - name: Check qualified destructive writer build
      run: cargo check --manifest-path src-tauri/Cargo.toml --features qualified-flash

    - name: Test qualified destructive writer gates
      run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features qualified-flash
