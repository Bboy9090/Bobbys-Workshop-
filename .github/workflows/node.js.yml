name: Node.js CI

on:
  push:
    branches: [ "main", "master", "main-tool-kit" ]
  pull_request:
    branches: [ "main", "master", "main-tool-kit" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24.x"
        
    - name: Install Dependencies
      run: npm install
      
    - name: Production Reality Gate
      run: npm run verify:reality

    - name: Typecheck Frontend
      run: npm run typecheck

    - name: Build
      run: npm run build --if-present
      
    - name: Test
      run: npm test --if-present

    - name: Validate workflow definitions
      run: npm run test:workflows


  macos-rust:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24.x"

    - name: Install Dependencies
      run: npm install

    - name: Production Reality Gate
      run: npm run verify:reality

    - name: Typecheck Frontend
      run: npm run typecheck

    - name: Build Frontend
      run: npm run build

    - name: Check embedded USB crate
      run: cargo check --manifest-path libs/bootforgeusb/Cargo.toml --no-default-features

    - name: Check Tauri Rust core
      run: cargo check --manifest-path src-tauri/Cargo.toml
