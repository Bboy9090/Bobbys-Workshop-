name: Node.js CI

on:
  push:
    branches: [ "main", "master", "main-tool-kit" ]
  pull_request:
    branches: [ "main", "master", "main-tool-kit" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24.x"
        package-manager-cache: false
        
    - name: Generate dependency remediation candidate
      if: github.head_ref == 'replay/bobfwtools-swift-studio-20261103'
      run: |
        node -e "const fs=require('fs');const p='package.json';const pkg=JSON.parse(fs.readFileSync(p,'utf8'));pkg.overrides={...(pkg.overrides||{}),minimatch:'11.0.4'};fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\\n')"
        npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        for dir in src-tauri/resources/server src-tauri/bundle/resources/server; do
          (
            cd "$dir"
            node -e "const fs=require('fs');const p='package.json';const pkg=JSON.parse(fs.readFileSync(p,'utf8'));pkg.overrides={...(pkg.overrides||{}),qs:'6.17.1'};fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\\n')"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          )
        done

    - name: Install Dependencies
      run: npm ci
      
    - name: Install packaged API dependencies
      run: |
        npm ci --prefix src-tauri/resources/server --ignore-scripts
        npm ci --prefix src-tauri/bundle/resources/server --ignore-scripts

    - name: Audit dormant server dependency trees
      run: |
        npm audit --prefix src-tauri/resources/server --audit-level=moderate
        npm audit --prefix src-tauri/bundle/resources/server --audit-level=moderate

    - name: Production Reality Gate
      run: npm run verify:reality

    - name: Build
      run: npm run build --if-present
      
    - name: Test
      run: npm test --if-present

    - name: Validate workflow definitions
      run: npm run test:workflows

    - name: Upload dependency remediation candidate
      if: github.head_ref == 'replay/bobfwtools-swift-studio-20261103'
      uses: actions/upload-artifact@v4
      with:
        name: dependency-lock-remediation
        path: |
          package.json
          package-lock.json
          src-tauri/resources/server/package.json
          src-tauri/resources/server/package-lock.json
          src-tauri/bundle/resources/server/package.json
          src-tauri/bundle/resources/server/package-lock.json
        if-no-files-found: error

    - name: Persist qualified dependency locks to replay branch
      if: github.head_ref == 'replay/bobfwtools-swift-studio-20261103'
      env:
        TARGET_BRANCH: replay/bobfwtools-swift-studio-20261103
      run: |
        git fetch origin "$TARGET_BRANCH"
        git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
        node -e "const fs=require('fs');const p='package.json';const pkg=JSON.parse(fs.readFileSync(p,'utf8'));pkg.overrides={...(pkg.overrides||{}),minimatch:'11.0.4'};fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\\n')"
        npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        for dir in src-tauri/resources/server src-tauri/bundle/resources/server; do
          (
            cd "$dir"
            node -e "const fs=require('fs');const p='package.json';const pkg=JSON.parse(fs.readFileSync(p,'utf8'));pkg.overrides={...(pkg.overrides||{}),qs:'6.17.1'};fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\\n')"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          )
        done
        git add package.json package-lock.json src-tauri/resources/server/package.json src-tauri/resources/server/package-lock.json src-tauri/bundle/resources/server/package.json src-tauri/bundle/resources/server/package-lock.json
        if git diff --cached --quiet; then
          echo "Qualified dependency locks already persisted."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "security: persist qualified npm audit lock remediation"
        git push origin "HEAD:$TARGET_BRANCH"


  macos-rust:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24.x"
        package-manager-cache: false

    - name: Install Dependencies
      run: npm install

    - name: Production Reality Gate
      run: npm run verify:reality

    - name: Build Frontend
      run: npm run build

    - name: Check embedded USB crate
      run: cargo check --manifest-path libs/bootforgeusb/Cargo.toml --no-default-features

    - name: Check Tauri Rust core
      run: cargo check --manifest-path src-tauri/Cargo.toml
