name: Temporary lockfile regeneration
# one-shot branch utility; remove after lockfile commit

on:
  push:
    branches:
      - fix/samsung-windows-family-evidence-20261023

permissions:
  contents: read

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Regenerate package-lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched resolutions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          for (const [name, expected] of Object.entries({
            'body-parser': '1.20.9',
            'fast-uri': '3.1.9',
            'zod': '4.6.7',
          })) {
            const actual = lock.packages['node_modules/' + name]?.version;
            if (actual !== expected) throw new Error(name + ' expected ' + expected + ' but got ' + actual);
            console.log(name, actual);
          }
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
