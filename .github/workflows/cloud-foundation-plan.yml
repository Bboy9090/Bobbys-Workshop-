name: Cloud foundation plan
on:
  pull_request:
    paths: ['infra/cloud/**', '.github/workflows/cloud-foundation-plan.yml']
permissions:
  contents: read
jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform -chdir=infra/cloud fmt -check -diff
      - run: terraform -chdir=infra/cloud init -backend=false
      - run: terraform -chdir=infra/cloud validate
