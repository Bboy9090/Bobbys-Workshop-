name: BobFWTools macOS Signed Release

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: "Human-readable release label, for example 0.1.0-rc1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bobfwtools-macos-release
  cancel-in-progress: false

env:
  BOBFWTOOLS_SOURCE_REVISION: ${{ github.sha }}

jobs:
  signed-macos-release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate release label
        shell: bash
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_LABEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "Release label must be 1-64 characters using only letters, numbers, dot, underscore, or hyphen."
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in             MACOS_CERTIFICATE_P12_BASE64             MACOS_CERTIFICATE_PASSWORD             MACOS_SIGNING_IDENTITY             APPLE_ID             APPLE_APP_SPECIFIC_PASSWORD             APPLE_TEAM_ID
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required release secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Production reality and tests
        run: |
          npm run verify:reality
          npm run typecheck
          npm run build
          npm test
          npm run test:workflows
          cargo check --manifest-path libs/bootforgeusb/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/bobfwtools-signing.keychain-db"
          CERT_P12="$RUNNER_TEMP/bobfwtools-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | openssl base64 -d -A > "$CERT_P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_P12"             -k "$KEYCHAIN"             -P "$MACOS_CERTIFICATE_PASSWORD"             -T /usr/bin/codesign             -T /usr/bin/security
          security set-key-partition-list             -S apple-tool:,apple:,codesign:             -s             -k "$KEYCHAIN_PASSWORD"             "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$MACOS_SIGNING_IDENTITY"; then
            echo "Configured signing identity is not present in the imported certificate."
            exit 1
          fi

      - name: Build universal non-qualified app
        run: npm run tauri:build:macos:ci

      - name: Verify universal safe build
        run: bash scripts/verify-bobfwtools-macos-release-preflight.sh

      - name: Sign BobFWTools.app
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/BobFWTools.app"

          codesign             --force             --deep             --options runtime             --timestamp             --entitlements src-tauri/entitlements.mac.plist             --sign "$MACOS_SIGNING_IDENTITY"             "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"
          DETAILS="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          printf '%s\n' "$DETAILS"

          printf '%s\n' "$DETAILS" | grep -F "Authority=Developer ID Application:"
          printf '%s\n' "$DETAILS" | grep -F "TeamIdentifier=$APPLE_TEAM_ID"

      - name: Notarize and staple app
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/BobFWTools.app"
          ZIP="$RUNNER_TEMP/BobFWTools-universal-macOS-notarization.zip"
          OUT="$RUNNER_TEMP/release"
          APP_NOTARY_JSON="$OUT/APP-NOTARIZATION.json"
          mkdir -p "$OUT"

          ditto -c -k --keepParent "$APP" "$ZIP"

          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json > "$APP_NOTARY_JSON"

          python3 - "$APP_NOTARY_JSON" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          status = data.get('status')
          submission_id = data.get('id')
          if status != 'Accepted' or not submission_id:
              raise SystemExit(f"App notarization was not accepted: status={status!r} id={submission_id!r}")
          print(f"app_notary_id={submission_id}")
          print(f"app_notary_status={status}")
          PY

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Build, notarize, and staple DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/BobFWTools.app"
          OUT="$RUNNER_TEMP/release"
          DMG="$OUT/BobFWTools-${{ inputs.release_label }}-universal-macOS.dmg"
          mkdir -p "$OUT"

          hdiutil create             -volname "BobFWTools"             -srcfolder "$APP"             -ov             -format UDZO             "$DMG"

          DMG_NOTARY_JSON="$OUT/DMG-NOTARIZATION.json"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json > "$DMG_NOTARY_JSON"

          python3 - "$DMG_NOTARY_JSON" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          status = data.get('status')
          submission_id = data.get('id')
          if status != 'Accepted' or not submission_id:
              raise SystemExit(f"DMG notarization was not accepted: status={status!r} id={submission_id!r}")
          print(f"dmg_notary_id={submission_id}")
          print(f"dmg_notary_status={status}")
          PY

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

          ditto -c -k --keepParent "$APP" "$OUT/BobFWTools-${{ inputs.release_label }}-universal-macOS.app.zip"

      - name: Write release receipt
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/BobFWTools.app"
          BIN="$APP/Contents/MacOS/bobfwtools"
          RECEIPT="$OUT/RELEASE-RECEIPT.txt"

          APP_NOTARY_JSON="$OUT/APP-NOTARIZATION.json"
          DMG_NOTARY_JSON="$OUT/DMG-NOTARIZATION.json"
          APP_NOTARY_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$APP_NOTARY_JSON")"
          APP_NOTARY_STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$APP_NOTARY_JSON")"
          DMG_NOTARY_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$DMG_NOTARY_JSON")"
          DMG_NOTARY_STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$DMG_NOTARY_JSON")"

          {
            echo "BobFWTools macOS release receipt"
            echo "label=${{ inputs.release_label }}"
            echo "source_sha=$GITHUB_SHA"
            echo "qualified_destructive_feature=false"
            echo "architectures=$(lipo -archs "$BIN")"
            echo "binary_sha256=$(shasum -a 256 "$BIN" | awk '{print $1}')"
            echo "app_notary_id=$APP_NOTARY_ID"
            echo "app_notary_status=$APP_NOTARY_STATUS"
            echo "dmg_notary_id=$DMG_NOTARY_ID"
            echo "dmg_notary_status=$DMG_NOTARY_STATUS"
            echo
            echo "Artifacts:"
            (cd "$OUT" && shasum -a 256 *.dmg *.zip APP-NOTARIZATION.json DMG-NOTARIZATION.json)
          } > "$RECEIPT"

          cat "$RECEIPT"

      - name: Write JSON release provenance receipt
        shell: bash
        env:
          BOBFWTOOLS_RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/BobFWTools.app"
          DMG="$OUT/BobFWTools-${{ inputs.release_label }}-universal-macOS.dmg"
          bash scripts/create-bobfwtools-release-receipt.sh \
            "$APP" \
            "$DMG" \
            "$OUT/APP-NOTARIZATION.json" \
            "$OUT/DMG-NOTARIZATION.json" \
            "$OUT/RELEASE-RECEIPT.json"

      - name: Upload signed notarized macOS release
        uses: actions/upload-artifact@v7
        with:
          name: BobFWTools-${{ inputs.release_label }}-signed-notarized-macOS
          path: |
            ${{ runner.temp }}/release/*.dmg
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/APP-NOTARIZATION.json
            ${{ runner.temp }}/release/DMG-NOTARIZATION.json
            ${{ runner.temp }}/release/RELEASE-RECEIPT.txt
            ${{ runner.temp }}/release/RELEASE-RECEIPT.json
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/bobfwtools-signing.keychain-db" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/bobfwtools-signing.p12"
