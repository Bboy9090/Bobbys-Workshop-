name: BobFWTools macOS Signed Release

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: "Human-readable release label, for example 0.1.0-rc1"
        required: true
        type: string

permissions:
  contents: read

env:
  BOBFWTOOLS_SOURCE_REVISION: ${{ github.sha }}

jobs:
  signed-macos-release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in             MACOS_CERTIFICATE_P12_BASE64             MACOS_CERTIFICATE_PASSWORD             MACOS_SIGNING_IDENTITY             APPLE_ID             APPLE_APP_SPECIFIC_PASSWORD             APPLE_TEAM_ID
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required release secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm install

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Production reality and tests
        run: |
          npm run verify:reality
          npm run typecheck
          npm run build
          npm test
          npm run test:workflows
          cargo check --manifest-path libs/bootforgeusb/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/bobfwtools-signing.keychain-db"
          CERT_P12="$RUNNER_TEMP/bobfwtools-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | openssl base64 -d -A > "$CERT_P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_P12"             -k "$KEYCHAIN"             -P "$MACOS_CERTIFICATE_PASSWORD"             -T /usr/bin/codesign             -T /usr/bin/security
          security set-key-partition-list             -S apple-tool:,apple:,codesign:             -s             -k "$KEYCHAIN_PASSWORD"             "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$MACOS_SIGNING_IDENTITY"; then
            echo "Configured signing identity is not present in the imported certificate."
            exit 1
          fi

      - name: Build universal non-qualified app
        run: npm run tauri:build:macos:ci

      - name: Verify universal safe build
        run: bash scripts/verify-bobfwtools-macos-release-preflight.sh

      - name: Sign BobFWTools.app
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/BobFWTools.app"

          codesign             --force             --deep             --options runtime             --timestamp             --entitlements src-tauri/entitlements.mac.plist             --sign "$MACOS_SIGNING_IDENTITY"             "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"
          DETAILS="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          printf '%s\n' "$DETAILS"

          printf '%s\n' "$DETAILS" | grep -F "Authority=Developer ID Application:"
          printf '%s\n' "$DETAILS" | grep -F "TeamIdentifier=$APPLE_TEAM_ID"

      - name: Notarize and staple app
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/BobFWTools.app"
          ZIP="$RUNNER_TEMP/BobFWTools-universal-macOS-notarization.zip"

          ditto -c -k --keepParent "$APP" "$ZIP"

          xcrun notarytool submit "$ZIP"             --apple-id "$APPLE_ID"             --password "$APPLE_APP_SPECIFIC_PASSWORD"             --team-id "$APPLE_TEAM_ID"             --wait

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Build, notarize, and staple DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/BobFWTools.app"
          OUT="$RUNNER_TEMP/release"
          DMG="$OUT/BobFWTools-${{ inputs.release_label }}-universal-macOS.dmg"
          mkdir -p "$OUT"

          hdiutil create             -volname "BobFWTools"             -srcfolder "$APP"             -ov             -format UDZO             "$DMG"

          xcrun notarytool submit "$DMG"             --apple-id "$APPLE_ID"             --password "$APPLE_APP_SPECIFIC_PASSWORD"             --team-id "$APPLE_TEAM_ID"             --wait

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

          ditto -c -k --keepParent "$APP" "$OUT/BobFWTools-${{ inputs.release_label }}-universal-macOS.app.zip"

      - name: Write release receipt
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/BobFWTools.app"
          BIN="$APP/Contents/MacOS/bobfwtools"
          RECEIPT="$OUT/RELEASE-RECEIPT.txt"

          {
            echo "BobFWTools macOS release receipt"
            echo "label=${{ inputs.release_label }}"
            echo "source_sha=$GITHUB_SHA"
            echo "qualified_destructive_feature=false"
            echo "architectures=$(lipo -archs "$BIN")"
            echo "binary_sha256=$(shasum -a 256 "$BIN" | awk '{print $1}')"
            echo
            echo "Artifacts:"
            (cd "$OUT" && shasum -a 256 *.dmg *.zip)
          } > "$RECEIPT"

          cat "$RECEIPT"

      - name: Upload signed notarized macOS release
        uses: actions/upload-artifact@v4
        with:
          name: BobFWTools-${{ inputs.release_label }}-signed-notarized-macOS
          path: |
            ${{ runner.temp }}/release/*.dmg
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/RELEASE-RECEIPT.txt
          if-no-files-found: error
