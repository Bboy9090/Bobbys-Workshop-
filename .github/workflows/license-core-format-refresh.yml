name: License core format refresh

on:
  pull_request:
    branches: [ "feat/bobfwtools-macos-foundation" ]
    paths:
      - 'libs/bbw-license-core/**'
      - '.github/workflows/license-core-format-refresh.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format license core
        run: cargo fmt --manifest-path libs/bbw-license-core/Cargo.toml
      - name: Commit rustfmt output
        if: github.event_name == 'pull_request' && github.head_ref == 'replay/license-core-after-security-20261031'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libs/bbw-license-core
          if git diff --cached --quiet; then
            echo "License core already formatted."
          else
            git commit -m "style: rustfmt license core"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
