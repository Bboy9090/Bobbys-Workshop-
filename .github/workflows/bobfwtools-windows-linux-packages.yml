name: BobFWTools Windows and Linux Packages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/bobfwtools-windows-linux-packages.yml'
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-msi-nsis-unsigned
            bundles: msi,nsis
          - os: ubuntu-22.04
            name: linux-appimage-deb-unsigned
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path libs/bootforgeusb/Cargo.toml
      - name: Build platform installers
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Upload unsigned package evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/**
            src-tauri/target/release/bundle/nsis/**
            src-tauri/target/release/bundle/appimage/**
            src-tauri/target/release/bundle/deb/**
          if-no-files-found: error
