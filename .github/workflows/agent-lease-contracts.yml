name: Agent lease contracts
on:
  pull_request:
    paths:
      - 'scripts/agents/task-lease*.cjs'
      - '.github/workflows/agent-lease-contracts.yml'
  push:
    branches: [main-tool-kit]
    paths:
      - 'scripts/agents/task-lease*.cjs'
      - '.github/workflows/agent-lease-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: node --test scripts/agents/task-lease.test.cjs
