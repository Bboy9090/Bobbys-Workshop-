name: Toolchain lock refresh

on:
  pull_request:
    branches: [ "feat/bobfwtools-macos-foundation" ]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/toolchain-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Resolve package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Show minimatch resolution
        run: npm ls minimatch --all || true
      - name: Audit resolved development toolchain
        run: npm audit --audit-level=moderate
      - name: Commit resolved lockfile to experiment branch
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/minimatch-11-compat-20261031'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Resolved lockfile already committed."
          else
            git commit -m "chore: resolve minimatch 11.0.2 lockfile"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resolved-package-lock
          path: package-lock.json
          if-no-files-found: error
