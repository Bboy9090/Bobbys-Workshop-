name: Toolchain lock refresh

on:
  pull_request:
    branches: [ "feat/bobfwtools-macos-foundation" ]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/toolchain-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Resolve package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Show minimatch resolution
        run: npm ls minimatch --all || true
      - name: Audit resolved development toolchain
        run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resolved-package-lock
          path: package-lock.json
          if-no-files-found: error
