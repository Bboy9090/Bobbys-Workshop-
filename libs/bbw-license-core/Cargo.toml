[package]
name = "bbw-license-core"
version = "0.1.0"
edition = "2021"
publish = false

# The desktop build depends on this crate with default features only.
# `issuer` contains server-side signing code and must never be enabled in a client build.
[features]
default = []
issuer = []

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[workspace]
