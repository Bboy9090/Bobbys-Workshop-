[package]
name = "bootforgeusb"
version = "0.2.0"
edition = "2021"
authors = ["Bobby Blanco"]
description = "BobFWTools native USB device enumeration and evidence layer"
license = "MIT"

[lib]
name = "bootforgeusb"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bootforgeusb"
path = "src/main.rs"

[dependencies]
rusb = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
md-5 = "0.10"
quick-xml = "0.38"
sha2 = "0.10"
tar = "0.4"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
python = ["pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
