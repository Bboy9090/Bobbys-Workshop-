<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BW Console" />
  <title>Bobby's Workshop — Operational Console</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf2ff;background:#06101d;color-scheme:dark}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,#10284c 0,transparent 33%),radial-gradient(circle at 88% 0%,#31152b 0,transparent 25%),#06101d}
    a{color:inherit}.shell{max-width:1440px;margin:auto;padding:24px}.top{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.brand h1{margin:0;font-size:clamp(26px,4vw,46px);letter-spacing:-.04em}.brand p{margin:.4rem 0 0;color:#91a3bd}.live{display:flex;gap:9px;align-items:center;padding:9px 12px;border:1px solid #1d3859;border-radius:999px;background:#081828;color:#bcd0ea;font-size:13px}.pulse{width:9px;height:9px;border-radius:50%;background:#38d68a;box-shadow:0 0 18px #38d68a}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{background:linear-gradient(180deg,rgba(12,29,48,.96),rgba(7,18,31,.96));border:1px solid #183555;border-radius:20px;padding:18px;box-shadow:0 18px 55px rgba(0,0,0,.25)}.panel h2{font-size:13px;letter-spacing:.16em;color:#82aee5;margin:0 0 13px}.stack{display:grid;gap:10px}.card{border:1px solid #17324f;background:#081725;border-radius:14px;padding:13px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.title{font-weight:800}.detail{font-size:13px;color:#9fb1c9;line-height:1.45;margin-top:5px}.pill{white-space:nowrap;font-size:11px;font-weight:900;letter-spacing:.06em;padding:5px 8px;border-radius:999px;background:#132a43;color:#a8c9ef}.PASS,.RUNNING,.APPROVED{background:#123c2d;color:#77ebb0}.BLOCKED,.BLOCKER{background:#451e26;color:#ff9eac}.UNKNOWN{background:#49391a;color:#ffd77d}.ACTIVE,.ACTIVE_FIX,.IN_REVIEW{background:#183758;color:#8dc8ff}.HOLD{background:#3b2a45;color:#d8a6ff}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;color:#7589a5;font-size:11px}.books{display:grid;gap:10px}.book{border-left:3px solid #366fab;padding-left:11px}.book strong{display:block}.book small{display:block;color:#9fb1c9;margin-top:4px;line-height:1.45}.footer{margin-top:18px;color:#6f849f;font-size:12px;text-align:center}.install{display:none;border:1px solid #2b6ca8;background:#0c2c4b;color:#dcebff;border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer}.install.show{display:inline-block}.empty{color:#71849d;font-size:13px}.updated{font-size:11px;color:#6e839e;margin-top:8px}
    @media(max-width:820px){.shell{padding:14px}.top{flex-direction:column}.grid{grid-template-columns:1fr}.panel{border-radius:16px}.row{align-items:flex-start}.brand h1{font-size:30px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><h1>Bobby's Workshop Console</h1><p>Evidence-first operating view across software, releases, publishing, and calendar.</p></div>
      <div style="display:flex;gap:9px;align-items:center"><button id="installBtn" class="install">Install Console</button><div class="live"><span class="pulse"></span><span id="healthLabel">Loading live evidence…</span></div></div>
    </header>
    <section class="grid">
      <article class="panel"><h2>ACTIVE NOW</h2><div id="activeNow" class="stack"></div></article>
      <article class="panel"><h2>RECENT VERIFIED WORK</h2><div id="recent" class="stack"></div></article>
      <article class="panel"><h2>THIS WEEK</h2><div id="week" class="stack"></div></article>
      <article class="panel"><h2>BLOCKERS</h2><div id="blockers" class="stack"></div></article>
      <article class="panel"><h2>RUNTIME</h2><div id="runtime" class="stack"></div></article>
      <article class="panel"><h2>PUBLISHING</h2><div id="publishing" class="books"></div></article>
    </section>
    <div class="footer"><div id="lastUpdated"></div><div>Rule: missing evidence stays UNKNOWN.</div></div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
